<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Call Jarvis home-security product architecture</title><desc id="desc">Home cameras feed Call Jarvis, which detects critical events and calls the homeowner through Chert. The homeowner asks to see the live feed and continues the conversation through FaceTime.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315e70"/></marker></defs><rect width="1440" height="820" fill="#eee9dd"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d4e}.serif{font-family:Georgia,serif}.small{fill:#5c6d72}.label{fill:#7d704c;letter-spacing:2px}.edge{fill:none;stroke:#315e70;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="40" y="48" font-size="13" class="label">CALL JARVIS · HOME SECURITY</text>
<text x="40" y="98" font-size="39" class="serif">The intelligent bridge between your home and you.</text>
<text x="40" y="134" font-size="19" class="small">Monitor the home. Call when it matters. Let the homeowner see and respond.</text>
<rect x="40" y="235" width="280" height="166" rx="10" fill="#fffdf6" stroke="#c9c5b5"/>
<text x="60" y="273" font-size="11" class="label">CAMERAS</text>
<text x="60" y="313" font-size="25" class="serif">Home security system</text>
<text x="60" y="348" font-size="16" class="small">Live camera feed</text>
<text x="60" y="373" font-size="16" class="small">Activity in the house</text>
<rect x="400" y="235" width="280" height="166" rx="10" fill="#e0e5da" stroke="#c9c5b5"/>
<text x="420" y="273" font-size="11" class="label">INTELLIGENCE</text>
<text x="420" y="313" font-size="25" class="serif">Call Jarvis</text>
<text x="420" y="348" font-size="16" class="small">Process activity &amp; assess urgency</text>
<text x="420" y="373" font-size="16" class="small">Initiate critical alerts</text>
<rect x="760" y="235" width="280" height="166" rx="10" fill="#fffdf6" stroke="#c9c5b5"/>
<text x="780" y="273" font-size="11" class="label">CONNECTION</text>
<text x="780" y="313" font-size="25" class="serif">Chert</text>
<text x="780" y="348" font-size="16" class="small">FaceTime connection</text>
<text x="780" y="373" font-size="16" class="small">Two-way voice and video</text>
<rect x="1120" y="235" width="280" height="166" rx="10" fill="#fffdf6" stroke="#c9c5b5"/>
<text x="1140" y="273" font-size="11" class="label">MOBILE</text>
<text x="1140" y="313" font-size="25" class="serif">Homeowner</text>
<text x="1140" y="348" font-size="16" class="small">Mobile FaceTime app</text>
<text x="1140" y="373" font-size="16" class="small">See the home and speak to Jarvis</text>
<path class="edge" d="M320 322H392"/>
<text x="321" y="300" font-size="12" class="small">Live feed</text>
<path class="edge" d="M680 322H752" marker-start="url(#arrow)"/>
<text x="681" y="300" font-size="12" class="small">Alert / feed</text>
<path class="edge" d="M1040 322H1112" marker-start="url(#arrow)"/>
<text x="1041" y="300" font-size="12" class="small">FaceTime</text>
<path class="edge" d="M1260 401V459H540V401" stroke-dasharray="6 5"/>
<text x="646" y="443" font-size="18" class="serif">“Show me the live feed” · homeowner request returns to Jarvis</text>
<rect x="40" y="505" width="1360" height="215" rx="10" fill="#f8f4ea" stroke="#c9c5b5"/>
<text x="64" y="547" font-size="12" class="label">01 · MONITOR</text>
<text x="64" y="589" font-size="18" class="">Home camera activity</text>
<text x="64" y="617" font-size="18" class="">is processed by Jarvis.</text>
<text x="400" y="547" font-size="12" class="label">02 · ALERT</text>
<text x="400" y="589" font-size="18" class="">Critical event → immediate</text>
<text x="400" y="617" font-size="18" class="">FaceTime Video call via Chert.</text>
<text x="736" y="547" font-size="12" class="label">03 · ASK</text>
<text x="736" y="589" font-size="18" class="">The homeowner asks to</text>
<text x="736" y="617" font-size="18" class="">see what is happening.</text>
<text x="1072" y="547" font-size="12" class="label">04 · SEE &amp; RESPOND</text>
<text x="1072" y="589" font-size="18" class="">Live home video is delivered</text>
<text x="1072" y="617" font-size="18" class="">within the FaceTime conversation.</text>
<text x="64" y="676" font-size="19" class="serif">Routine activity → continue monitoring. Critical activity → bring the homeowner into a conversation.</text>
<text x="40" y="766" font-size="23" class="serif">Home camera → Call Jarvis intelligence → Chert connection → informed homeowner</text>
<text x="40" y="796" font-size="13" class="small">Product architecture · Home-security use case</text>
</svg>